[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "psycopg[binary]>=3.2", "alembic>=1.13", "pydantic-settings>=2.4", "python-multipart>=0.0.9", "PyMuPDF>=1.24", "pgvector>=0.3", "celery[redis]>=5.4", "httpx>=0.27", "pwdlib[argon2]>=0.2", "PyJWT>=2.9", "email-validator>=2.2", "slowapi>=0.1.9", "boto3>=1.35"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "aiosqlite>=0.20"]
[tool.setuptools.packages.find]
include = ["backend*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
