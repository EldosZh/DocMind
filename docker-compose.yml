services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docmind-local-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://docmind:${POSTGRES_PASSWORD:-docmind-local-only}@db:5432/docmind
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      FRONTEND_ORIGINS: http://localhost:8080
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.app.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://docmind:${POSTGRES_PASSWORD:-docmind-local-only}@db:5432/docmind
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:8080"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  uploads:
